[project]
name = "inpaint-studio"
version = "0.1.0"
description = "Local two-step mask + Qwen-Image 2.1 inpainting UI on top of ComfyUI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    "python-multipart>=0.0.9",
    "pillow>=12.3.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
